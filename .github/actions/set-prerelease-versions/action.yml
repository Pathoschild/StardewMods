name: "Set Prerelease Versions"
description: "Increment C# mod project versions to timestamped prerelease versions."

inputs:
    only_zipped:
        description: "Whether to only change projects which create a mod release zip. This only checks for a `<EnableModZip>` setting in the raw XML; it doesn't fully parse the project, so it doesn't handle inherited or conditional properties. Default true."
        required: false
        default: true

runs:
    using: "composite"
    steps:
        - shell: pwsh
          run: |
              $projectFiles = Get-ChildItem -Recurse -File | Where-Object { $_.Extension -eq ".csproj" }

              foreach ($projectFile in $projectFiles) {
                  $fullPath = $projectFile.FullName
                  $relativePath = Resolve-Path -Path $fullPath -Relative

                  $xml = [xml](Get-Content $fullPath)

                  # skip if it doesn't produce zip
                  if ('${{inputs.only_zipped}}' -eq 'true') {
                      $enableModZipNode = Select-Xml -Xml $xml -XPath '//EnableModZip' | Select-Object -Last 1
                      $enableModZip = if ($enableModZipNode) { [bool]::Parse($enableModZipNode.Node.InnerText) } else { $true }
                      if (!$enableModZip) {
                          Write-Host "Skipped $($relativePath): <EnableModZip> is false."
                          continue
                      }
                  }

                  # extract current version
                  $versionNode = Select-Xml -Xml $xml -XPath '//Version' | Select-Object -Last 1
                  if (!$versionNode) {
                      Write-Warning "Skipped $($relativePath): no <Version> element found."
                      continue
                  }

                  # parse current version
                  $oldVersion = $versionNode.Node.InnerText
                  if ($oldVersion -match '^(?<major>\d+)\.(?<minor>\d+)(?:\.(?<patch>\d+)?)(-(?<prerelease>[0-9A-Za-z.-]+))?$') {
                      $oldMajor = [int]$matches['major']
                      $oldMinor = [int]$matches['minor']
                      $oldPatch = if ($matches['patch']) { [int]$matches['patch'] } else { 0 }
                      $oldPrerelease = $matches['prerelease']
                  }
                  else {
                      Write-Warning "Skipped $($relativePath): version '$oldVersion' couldn't be parsed as a semantic version number."
                      continue
                  }

                  # build new version
                  $newPatch = $oldPatch
                  if (!$oldPrerelease) {
                      $newPatch += 1
                  }
                  $timestamp = (Get-Date).ToString("yyyyMMddHHmm")
                  $newVersion = "$oldMajor.$oldMinor.$newPatch-alpha.$timestamp"

                  # update project
                  $versionNode.Node.InnerText = $newVersion
                  $xml.Save($fullPath)

                  Write-Host "Updated $($relativePath): $oldVersion -> $newVersion."
              }
